<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ application_name }}</title>
    {% load static %}
    <link href="{% static 'tracker/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'tracker/css/inter.css' %}" rel="stylesheet">
    <link href="{% static 'tracker/css/main.css' %}" rel="stylesheet">
</head>
<body>
    <div class="container-fluid px-4">
        <nav class="navbar navbar-expand-lg glass mb-4 px-3 py-2">
            <div class="container-fluid px-0">
                <a class="navbar-brand" href="{% url 'task_list' %}">{{ application_name }}</a>
                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navMenu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'task_list' %}active{% endif %}" href="{% url 'task_list' %}">Tasks</a></li>
                        <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link {% if 'template' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'template_list' %}">Templates</a></li>
                        <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'holiday_list' %}active{% endif %}" href="{% url 'holiday_list' %}">Holidays</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-{{ msg.tags }} alert-dismissible fade show">{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>
    <script src="{% static 'tracker/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
